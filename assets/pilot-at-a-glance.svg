xt><text x="934" y="134" fill="#a6b8c3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >Arrival belief reached 95%</text><text x="34" y="174" fill="#a6b8c3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" >PILOT SCOPE  /  Seed 0 per map · physical simulation · counts describe these trials only</text></svg>