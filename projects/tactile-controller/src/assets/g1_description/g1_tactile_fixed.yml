  # ARM-ONLY variant of g1_tactile.yml. Identical in every other respect; the sole
  # difference is that everything except the 14 arm joints is locked here, so an IK
  # solve reaches with the ARMS ALONE - no base translation, no waist twist, no leg
  # bend helping the hand get there. 35 dof -> 14 dof (7 per arm), matching the RL
  # stack's torso-rooted arm IK convention (waist and legs out of the chain).
  # Locked values are exactly the default_joint_position entries, so the locked
  # posture IS the standing pose and the feet still sit on z=0.
  lock_joints:
    # --- synthesized floating base: locked so IK cannot translate/rotate the robot ---
    base_j_x: 0.0
    base_j_y: 0.0
    base_j_z: 0.8
    base_j_xtheta: 0.0
    base_j_ytheta: 0.0
    base_j_ztheta: 0.0
    # --- waist: locked, so the torso cannot twist/lean to help the hands reach ---
    waist_yaw_joint: 0.0
    waist_roll_joint: 0.0
    waist_pitch_joint: 0.0
    # --- legs: locked at the standing half-sitting pose ---
    left_hip_pitch_joint: -0.1
    left_hip_roll_joint: 0.0
    left_hip_yaw_joint: 0.0
    left_knee_joint: 0.3
    left_ankle_pitch_joint: -0.2
