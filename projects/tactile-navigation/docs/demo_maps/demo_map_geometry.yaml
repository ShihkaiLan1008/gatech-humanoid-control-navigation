    value_m: 1.5
    what: long + bottom wall extent WEST of C1's west chord end
    sketch_suggests: ~0.25 m (51 px at C1's local 0.53 cm/px)
    why_this_value: the dimension chain starts AT C1, so the tape never measured this stub; 1.50
      m gives the robot a straight run to acquire the wall before the first curved feature (spawn
      needs 0.60 m clear, and TOUCH_PITCH is 0.35 m). The lower corridor is left OPEN at its west
      end, exactly as drawn -- no wall closes it.
  east_stub_m:
    value_m: 0.7
    what: upper-room south wall from the doorway's east jamb to the east wall
    sketch_suggests: 0.61-0.80 m (43 px at the 1.43-1.85 cm/px local scale)
    why_this_value: drawn but unlabelled; the mid-range value is taken.
  upper_room_west_ext_m:
    value_m: 5.5
    what: how far the upper room reaches WEST of the corridor's west wall
    sketch_suggests: ~5.5 m (292 px at the corridor's 1.87 cm/px)
    why_this_value: unlabelled and not route-relevant -- the route turns east on entering the room.
      Taken at the nearest labelled x-scale.
  upper_room_depth_m:
    value_m: 4.0
    what: upper room north wall, i.e. its depth north of the south wall
    sketch_suggests: 3.4-7.7 m, depending which labelled datum sets the local y-scale (162.56 cm
      gives 3.4, 1054.1 cm gives 7.7)
    why_this_value: unlabelled, and the sketch cannot narrow it to better than 2x. Not route-relevant;
      4.00 m keeps the scene compact.
  thickness_m:
    value_m: 0.1
    what: wall thickness
    sketch_suggests: nothing -- single-line sketch
    why_this_value: the project standard (lane_graph.maps_v3.THICK, execution.scenes.THICKNESS,
      and the shipped maze-wall asset).
  height_m:
    value_m: 1.8
    what: wall height
    sketch_suggests: nothing -- the sketch is a plan view
    why_this_value: specified by the task.
